[project]
name = "uzh-app"
version = "0.1.0"
description = "UZH golden-path template: FastAPI + Jinja2 + HTMX, built on appkit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "appkit",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",   # test client only; app code must never import httpx
]

# appkit is the companion library. `uv sync` pulls it from git. Pin to a tag
# once appkit publishes releases.
[tool.uv.sources]
appkit = { git = "https://github.com/uzh-zi/appkit.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
