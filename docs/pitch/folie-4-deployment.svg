<text x="1340" y="376" font-size="23" fill="#0028A5" font-weight="600" letter-spacing="2">WAS DARAUS FOLGT</text>
<rect x="1340" y="431" width="9" height="9" fill="#0028A5"/>
<text x="1366" y="442" font-size="27" fill="#121212" font-weight="600">Keine öffentliche IP</text>
<text x="1366" y="476" font-size="21" fill="#666666">Die Landing Zone verbietet sie per</text>
<text x="1366" y="504" font-size="21" fill="#666666">Policy — der Weg über das Gateway</text>
<text x="1366" y="532" font-size="21" fill="#666666">ist nicht bevorzugt, sondern der einzige.</text>
<rect x="1340" y="585" width="9" height="9" fill="#0028A5"/>
<text x="1366" y="596" font-size="27" fill="#121212" font-weight="600">Zwei Pull Requests</text>
<text x="1366" y="630" font-size="21" fill="#666666">Subnetze kommen von Subscription</text>
<text x="1366" y="658" font-size="21" fill="#666666">Vending, der Ingress-Eintrag von</text>
<text x="1366" y="686" font-size="21" fill="#666666">Connectivity Management.</text>
<rect x="1340" y="739" width="9" height="9" fill="#0028A5"/>
<text x="1366" y="750" font-size="27" fill="#121212" font-weight="600">X-Forwarded-Host</text>
<text x="1366" y="784" font-size="21" fill="#666666">Ohne den injizierten Header baut Easy</text>
<text x="1366" y="812" font-size="21" fill="#666666">Auth die Redirect-URI auf den internen</text>
<text x="1366" y="840" font-size="21" fill="#666666">FQDN — und der Login scheitert.</text>
<rect x="1340" y="893" width="9" height="9" fill="#0028A5"/>
<text x="1366" y="904" font-size="27" fill="#121212" font-weight="600">Egress über die Firewall</text>
<text x="1366" y="938" font-size="21" fill="#666666">Graph, Login und Registry brauchen</text>
<text x="1366" y="966" font-size="21" fill="#666666">Regeln; sonst kommt die App nicht raus.</text>
<text x="100" y="1058" font-size="21" fill="#666666">Adate / Appkit — Pitch</text>
<text x="1820" y="1058" font-size="21" fill="#666666" text-anchor="end">4 / 6</text>
