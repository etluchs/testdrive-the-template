<text x="140" y="979" font-size="22" fill="#0028A5" font-weight="600">Azure OpenAI — eigene Subscription, für Test und Prod dieselbe</text>
<text x="140" y="1006" font-size="19" fill="#666666">Embeddings für die semantische Suche · Zugriff über Managed Identity · künftig der LLM-Proxy</text>
