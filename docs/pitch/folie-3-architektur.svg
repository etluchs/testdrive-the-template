<text x="140" y="976" font-size="22" fill="#121212">Azure Container Apps · Managed Identity · Easy Auth · Microsoft Graph · Postgres</text>
<rect x="1300" y="360" width="520" height="634" rx="10" fill="#FFFFFF" stroke="#E9E9E9" stroke-width="2"/>
<text x="1340" y="422" font-size="23" fill="#0028A5" font-weight="600" letter-spacing="2">WARUM DAS WICHTIG IST</text>
<rect x="1340" y="469" width="9" height="9" fill="#0028A5"/>
<text x="1366" y="480" font-size="28" fill="#121212" font-weight="600">Geklont</text>
<text x="1366" y="516" font-size="23" fill="#666666">Spätere Verbesserungen am Template</text>
<text x="1366" y="547" font-size="23" fill="#666666">wandern nicht von selbst in eine</text>
<text x="1366" y="578" font-size="23" fill="#666666">bestehende App.</text>
<rect x="1340" y="640" width="9" height="9" fill="#0028A5"/>
<text x="1366" y="651" font-size="28" fill="#121212" font-weight="600">Importiert</text>
<text x="1366" y="687" font-size="23" fill="#666666">Was in appkit behoben wird, kommt</text>
<text x="1366" y="718" font-size="23" fill="#666666">mit dem nächsten Update bei allen</text>
<text x="1366" y="749" font-size="23" fill="#666666">Apps an — einmal statt in jeder App.</text>
<rect x="1340" y="811" width="9" height="9" fill="#0028A5"/>
<text x="1366" y="822" font-size="28" fill="#121212" font-weight="600">Daraus folgt die Regel</text>
<text x="1366" y="858" font-size="23" fill="#666666">Fehlendes gehört in appkit, mit Fake</text>
<text x="1366" y="889" font-size="23" fill="#666666">und Test — nicht als Sonderlösung</text>
<text x="1366" y="920" font-size="23" fill="#666666">in die einzelne App.</text>
<text x="100" y="1058" font-size="21" fill="#666666">Adate / Appkit — Pitch</text>
<text x="1820" y="1058" font-size="21" fill="#666666" text-anchor="end">3 / 6</text>
