<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Arial,Helvetica,sans-serif">
  <title>Interne Apps aus einem Bauplan</title>
  <defs>
    <marker id="arw" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="9" markerHeight="8" orient="auto">
      <path d="M0 0 L12 5 L0 10 z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1920" height="10" fill="#0028A5"/>

  <text x="120" y="118" font-size="24" font-weight="600" letter-spacing="2.5" fill="#666666">UZH ZI · GOLDEN PATH FÜR INTERNE APPS</text>

  <text x="120" y="216" font-size="76" font-weight="600" fill="#0028A5">Interne Apps aus einem Bauplan</text>
  <text x="120" y="278" font-size="32" fill="#121212">Das Adate-/Appkit-Template — eine Skizze, validiert an der Überarbeitung des Servicekatalogs.</text>

  <!-- Reihe 1: bisher -->
  <text x="120" y="400" font-size="23" font-weight="600" letter-spacing="2" fill="#666666">SERVICEKATALOG BISHER</text>
  <g font-size="26" fill="#121212" text-anchor="middle">
    <rect x="120"  y="424" width="280" height="100" rx="8" fill="#FAFAFA" stroke="#E9E9E9" stroke-width="2"/>
    <text x="260"  y="482">SharePoint</text>
    <rect x="470"  y="424" width="280" height="100" rx="8" fill="#FAFAFA" stroke="#E9E9E9" stroke-width="2"/>
    <text x="610"  y="482">Indexer</text>
    <rect x="820"  y="424" width="280" height="100" rx="8" fill="#FAFAFA" stroke="#E9E9E9" stroke-width="2"/>
    <text x="960"  y="482">Elasticsearch</text>
    <rect x="1170" y="424" width="280" height="100" rx="8" fill="#FAFAFA" stroke="#E9E9E9" stroke-width="2"/>
    <text x="1310" y="482">CGI-Proxy</text>
    <rect x="1520" y="424" width="280" height="100" rx="8" fill="#FAFAFA" stroke="#E9E9E9" stroke-width="2"/>
    <text x="1660" y="482">SPA, 440 KB</text>
  </g>
  <g stroke="#666666" stroke-width="3" marker-end="url(#arw)">
    <path d="M415 474 H452"/><path d="M765 474 H802"/><path d="M1115 474 H1152"/><path d="M1465 474 H1502"/>
  </g>

  <!-- Reihe 2: mit Template -->
  <text x="120" y="620" font-size="23" font-weight="600" letter-spacing="2" fill="#666666">MIT DEM TEMPLATE</text>
  <g font-size="26" text-anchor="middle">
    <rect x="120" y="644" width="280" height="100" rx="8" fill="#0028A5"/>
    <text x="260" y="702" fill="#FFFFFF">SharePoint</text>
    <rect x="470" y="644" width="280" height="100" rx="8" fill="#0028A5"/>
    <text x="610" y="702" fill="#FFFFFF">Diese App</text>
  </g>
  <path d="M415 694 H452" stroke="#666666" stroke-width="3" marker-end="url(#arw)"/>
  <text x="830" y="686" font-size="28" fill="#121212">Gleiche Daten, gleiche Funktion —</text>
  <text x="830" y="724" font-size="28" font-weight="600" fill="#0028A5">zwei bewegliche Teile statt fünf.</text>

  <!-- Band -->
  <rect x="0" y="820" width="1920" height="190" fill="#F5F5FB"/>
  <g font-size="27" fill="#121212">
    <rect x="120" y="878" width="10" height="10" fill="#0028A5"/>
    <text x="152" y="888">Jeder Service hat eine eigene URL</text>
    <text x="152" y="930" font-size="23" fill="#666666">— vorher war Verlinken nicht möglich</text>

    <rect x="740" y="878" width="10" height="10" fill="#0028A5"/>
    <text x="772" y="888">Funktioniert ohne JavaScript</text>
    <text x="772" y="930" font-size="23" fill="#666666">— HTMX macht es nur schneller</text>

    <rect x="1300" y="878" width="10" height="10" fill="#0028A5"/>
    <text x="1332" y="888">Barrierefrei nach WCAG 2.1 AA</text>
    <text x="1332" y="930" font-size="23" fill="#666666">— in der CI bei jedem Commit geprüft</text>
  </g>

  <text x="120" y="1050" font-size="21" fill="#666666">Adate / Appkit — Pitch</text>
  <text x="1800" y="1050" font-size="21" fill="#666666" text-anchor="end">1 / 6</text>
</svg>
